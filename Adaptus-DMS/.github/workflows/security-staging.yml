name: Security staging (ZAP baseline)

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP baseline vs staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require STAGING_BASE_URL
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "::error::Secret STAGING_BASE_URL is not set. Configure a non-production staging URL."
            exit 1
          fi
          case "$STAGING_BASE_URL" in
            *app.flashfender.com*|https://flashfender.com*|http://flashfender.com*)
              echo "::error::Refusing ZAP against production. Use a staging URL only."
              exit 1
              ;;
          esac

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_BASE_URL }}
          rules_file_name: "tests/security/zap/.zap-rules.tsv"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-I"
