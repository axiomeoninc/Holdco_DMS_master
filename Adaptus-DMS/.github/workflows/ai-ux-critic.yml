name: AI UX Critic

on:
  pull_request:
    paths:
      - "src/components/ui/**"
      - "src/components/ImpersonationBanner*"
      - "src/**/*.stories.tsx"
      - ".storybook/**"
      - "scripts/ai-ux-critic.mjs"

permissions:
  contents: read
  pull-requests: write

jobs:
  critic:
    name: Gold UX critic comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch base for diff
        run: git fetch origin "${{ github.base_ref }}" --depth=1 || true

      - name: Run critic
        id: critic
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          AI_UX_CRITIC_MODEL_URL: ${{ secrets.AI_UX_CRITIC_MODEL_URL }}
          AI_UX_CRITIC_API_KEY: ${{ secrets.AI_UX_CRITIC_API_KEY }}
          AI_UX_CRITIC_MODEL: ${{ secrets.AI_UX_CRITIC_MODEL }}
          AI_UX_CRITIC_OUT: handoff/ai-ux-critic-latest.md
        run: node scripts/ai-ux-critic.mjs

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('handoff/ai-ux-critic-latest.md', 'utf8');
            const marker = '<!-- ai-ux-critic -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
