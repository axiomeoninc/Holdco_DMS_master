name: Lighthouse CI

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  # Prefer staging deploy hooks / manual dispatch; avoid cold Worker previews in v1.

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Staging Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require staging URL
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "::error::Missing GitHub secret STAGING_BASE_URL (e.g. https://staging.example.com)."
            exit 1
          fi
          echo "STAGING_BASE_URL=$STAGING_BASE_URL" >> "$GITHUB_ENV"

      - name: Run Lighthouse CI
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          # Expand ${STAGING_BASE_URL} inside lighthouserc.json collect.url
          node -e "
            const fs = require('fs');
            const base = process.env.STAGING_BASE_URL.replace(/\/$/, '');
            const cfg = JSON.parse(fs.readFileSync('lighthouserc.json', 'utf8'));
            cfg.ci.collect.url = [base + '/login'];
            fs.writeFileSync('lighthouserc.json', JSON.stringify(cfg, null, 2));
          "
          npx lhci autorun
