name: Perf staging (k6 smoke)

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-smoke:
    name: k6 low-VU smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require STAGING_BASE_URL
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "::error::Secret STAGING_BASE_URL is not set. Configure a non-production staging URL."
            exit 1
          fi
          case "$STAGING_BASE_URL" in
            *app.flashfender.com*|https://flashfender.com*|http://flashfender.com*)
              echo "::error::Refusing k6 against production. Use a staging URL only."
              exit 1
              ;;
          esac

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run staging smoke
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: k6 run -e BASE_URL="$BASE_URL" tests/perf/smoke.js
